name: Nerves System Build
on: push

env:
  OTP_VERSION: 28.3
  ELIXIR_VERSION: 1.19.4-otp-28
  NERVES_BOOTSTRAP_VERSION: 1.14.0

permissions:
  contents: read
  id-token: write

jobs:
  get-br-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: fhunleth/actions-nerves2-package@v0
      - name: Get Buildroot Dependencies
        uses: ./.actions/get-br-dependencies
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          nerves-bootstrap-version: ${{ env.NERVES_BOOTSTRAP_VERSION }}
          push-to-download-site: false
  build-system:
    needs: [get-br-dependencies]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: fhunleth/actions-nerves2-package@v0
      - name: Build nerves_system
        uses: ./.actions/build-system
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          nerves-bootstrap-version: ${{ env.NERVES_BOOTSTRAP_VERSION }}
  deploy-system:
    needs: [build-system]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: fhunleth/actions-nerves2-package@v0
      - name: Deploy nerves_system
        uses: ./.actions/deploy-system
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
